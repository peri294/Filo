# Corre los mismos chequeos que `npm run check` en una máquina limpia, en cada push y en cada PR.
# La protección de main en GitHub exige que este job ("check") esté en verde para mergear.
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # historial completo, para revisar cada commit del PR
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Aislamiento de roles: cada commit del PR declara su rol y toca solo sus archivos (docs/roles/).
      - if: github.event_name == 'pull_request'
        run: npx tsx scripts/verificar-rol.ts --rango "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - run: npm run check
